<head>

<body>
     <br><br><br><br><br><br><br>
    <div style="display: flex; gap: 200px; align-items: center; justify-content: center;"> <!-- არ მიაქციოთ ამას ჯერჯერობით ყურადღება -->
        <form id="registration_form">
            <h1>Registration Form</h1>
            <label>
                Enter your username <br>
                <input type="text" name="username" placeholder="username..." required class="input">
            </label>

            <br> <br> <br>

            <label>
                Enter your email <br>
                <input type="email" name="email" placeholder="email..." required class="input">
            </label>

            <br> <br> <br>

            <label>
                Enter your password <br> 
                <input type="password" name="password" placeholder="password..." required class="input">
            </label>
              <br> <br> <br>

            <label>
                Repeat your password <br>
                <input type="password" name="rep_password" placeholder="repeat password..." required class="input">
            </label>

            
</body>
