<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flex Example</title>
<style>
  .container {
    display: flex;
    align-items: center;
    background: #333;
    padding: 20px;
    height: 150px;
  }

  .item {
    width: 120px;
    height: 80px;
    background: #f4b400;
    margin-right: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .item3 {
    margin-left: auto;
  }
</style>
</head>
<body>

<div class="container">
  <div class="item">flex item 1</div>
  <div class="item">flex item 2</div>
  <div class="item item3">flex item 3</div>
</div>

</body>
</html>
