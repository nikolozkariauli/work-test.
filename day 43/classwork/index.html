<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
    .container {
      width: 400px;
      border: 3px solid blue; 
      padding: 10px;  
      margin: 20px auto; 
      display: flex;  
    }
    .box {
      width: 100px;   
      height: 100px;
      background-color: lightblue;
      text-align: center;
      border: 2px solid red;
    }
  </style>
</head>
<body>
  <h2>Box Model Demonstration</h2>
  <div class="container">
     <div class="box">100px</div>
    <div class="box">100px</div>
    <div class="box">100px</div>
    <div class="box">100px</div>
  </div>
</body>
</html>



<Content — ეს არის ელემენტის შიგთავსი, მაგალითად ტექსტი ან სურათი. წარმოიდგინე ოთხი პატარა ყუთი, თითოეული 100px სიგანის, რომლებიც ერთად ქმნიან 400px-ს.>



<Padding — სივრცე Content-ის გარშემო, თითქოს შიგნით დამატებული ჰაერი, რომელიც Border-მდეა.>


<Border — ჩარჩო, რომელიც გარს აკრავს Content-ს და Padding-ს. შეგიძლია წარმოიდგინო წითელი ხაზით შემოსაზღვრული ოთხი ყუთი.>



<Margin — გარე დაშორება, რომელიც ამ ყუთებს სხვა ელემენტებისგან აშორებს.>
