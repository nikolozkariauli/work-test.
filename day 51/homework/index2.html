<!--
HEX და RGB არის ფერის ჩაწერის ორი განსხვავებული ფორმატი.

HEX - ფერი იწერება # ნიშნით და იყენებს თექვსმეტობით სისტემას.
მაგალითი: #FF0000 (წითელი).

RGB - ფერი იწერება სამი რიცხვით: Red (წითელი), Green (მწვანე), Blue (ლურჯი).
მაგალითი: rgb(255, 0, 0) (წითელი).

განსხვავება:
- HEX იყენებს თექვსმეტობით მნიშვნელობებს (#RRGGBB).
- RGB იყენებს რიცხვებს 0-დან 255-მდე (rgb(R, G, B)).
ორივე ერთსა და იმავე ფერების გამოსახატად გამოიყენება, უბრალოდ ჩაწერის ფორმატი განსხვავდება.
-->
