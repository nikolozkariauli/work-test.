<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<style>
button {
 color: blue;
 background-color: yellow;
 font-size: larger;
 border: 2px dashed black;
 padding: 10px 20px;
 cursor: pointer;
  }
  </style>
</body>
</html>
