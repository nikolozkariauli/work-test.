<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hover Div Example</title>
  <style>
    .hoverDiv {
      width: 250px;
      height: 300px;
      background-color: black;
      border: 2px solid #333;
      
    }

    .hoverDiv:hover {
      background-color: red;
    }
  </style>
</head>
<body>
  <div class="hoverDiv"></div>
</body>
</html>
