    <!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <title>ინტერაქტიული div</title>
  <style>
    .red-box {
      background-color: red;
      height: 180px;
      width: 220px;
    }

    .red-box:hover {
      background-color: black;
    }

    .red-box:active {
      background-color: pink;
      background-image: radial-gradient(circle, black 2px, transparent 2px);
      background-size: 20px 20px;
    }
  </style>
</body>
</html>
